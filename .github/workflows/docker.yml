name: docker
on: push
jobs:
  docker:
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (for master branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: docker_build_master
        uses: docker/build-push-action@v5
        with:
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Find tag and save it to variable with set output (for tags)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        id: vars
        run: echo ::set-output name=tag::${GITHUB_REF#refs/*/}

      - name: Check action.yml image matches tag (for tags)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        run: |
          expected="docker://ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.tag }}"
          actual=$(yq '.runs.image' action.yml)
          if [ "$actual" != "$expected" ]; then
            echo "::error::action.yml runs.image ('$actual') does not match the pushed tag ('$expected'). Update action.yml before tagging a release."
            exit 1
          fi

      - name: Build and push (for tags)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        id: docker_build_tag
        uses: docker/build-push-action@v5
        with:
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.tag }}

      - name: Draft a new GitHub release (for tags)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: softprops/action-gh-release@v1
        with:
          draft: true
